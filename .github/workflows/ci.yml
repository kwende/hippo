name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-postgres-password
      HIPPO_CODEX_TOKEN: ci-codex-token
      HIPPO_CLAUDE_TOKEN: ci-claude-token
      HIPPO_TEST_TOKEN: ci-test-token

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hippo.sln

      - name: Build
        run: dotnet build Hippo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Hippo.sln --configuration Release --no-build

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start stack
        run: docker compose up --build --detach

      - name: Verify schema and readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8787/health/ready > /dev/null; then
              docker compose exec -T postgres \
                psql -U hippo -d hippo -v ON_ERROR_STOP=1 \
                -c "SELECT to_regclass('hippo.memory_item');"
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
